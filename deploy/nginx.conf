# Add this zone to the enclosing http block, outside the HTTPS server:
# limit_req_zone $binary_remote_addr zone=minecraft_skin_lookups:10m rate=5r/s;

# Add these locations to the HTTPS server that hosts the viewer.
location ~ ^/api/(profile|texture|upload)/ {
    limit_req zone=minecraft_skin_lookups burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}

location /healthz {
    proxy_pass http://127.0.0.1:8080;
}

location / {
    root /srv/minecraft-skin-viewer;
    try_files $uri $uri/ /index.html;
}
