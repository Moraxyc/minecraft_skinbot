# Add these locations to the HTTPS server that hosts the viewer.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
}

location /healthz {
    proxy_pass http://127.0.0.1:8080;
}

location / {
    root /srv/minecraft-skin-viewer;
    try_files $uri $uri/ /index.html;
}
