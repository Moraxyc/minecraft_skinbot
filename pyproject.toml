[project]
name = "minecraft-skin-bot"
version = "0.1.0"
description = "A stateless Minecraft skin resolver and Telegram inline utility"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram[i18n]==3.31.0",
  "aiohttp==3.14.3",
  "pillow==12.3.0",
]

[project.scripts]
minecraft-skin-bot = "minecraft_skin_bot.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot/src/minecraft_skin_bot"]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "types-Pillow>=10.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["bot/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
files = ["bot/src", "tests"]
strict = true
plugins = []
