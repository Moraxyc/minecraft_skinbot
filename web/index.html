<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Minecraft Skin Viewer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow" data-i18n="title">Minecraft Skin Viewer</p>
        <h1 id="name" data-i18n="heading">3D skin viewer</h1>
        <p id="details" data-i18n="openTelegramSkin" class="hint">Open a skin from Telegram.</p>
        <p id="upload-expiry" class="hint" hidden></p>
      </header>
      <form id="player-form" class="player-form" novalidate hidden>
        <label for="player-input" data-i18n="playerInput">Username or UUID</label>
        <div class="player-entry">
          <input id="player-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="player-error" required />
          <button id="player-submit" data-i18n="viewSkin" type="submit">View skin</button>
        </div>
        <p id="player-error" class="hint" role="alert" hidden></p>
      </form>
      <section id="stage" data-i18n-aria="stage" class="stage" aria-label="Interactive 3D skin">
        <canvas id="viewer" data-i18n-aria="canvas" aria-label="Drag to rotate. Pinch or scroll to zoom."></canvas>
        <p id="status" data-i18n="openBotSkin" class="status" role="status">Open a skin from the bot.</p>
      </section>
      <button id="retry" data-i18n="retry" type="button" class="secondary retry" hidden>Retry</button>
      <p id="viewer-notice" class="hint" role="status" hidden></p>
      <p class="hint gesture-hint" data-i18n="gestures">Drag to rotate · Pinch to zoom</p>
      <fieldset id="controls" disabled>
        <p class="control-label" id="camera-label" data-i18n="cameraView">View</p>
        <div class="camera-views" role="group" aria-labelledby="camera-label">
          <button type="button" data-camera-view="front" data-i18n="front" class="secondary">Front</button>
          <button type="button" data-camera-view="side" data-i18n="side" class="secondary">Side</button>
          <button type="button" data-camera-view="back" data-i18n="back" class="secondary">Back</button>
        </div>
        <div class="toolbar">
          <div class="camera-tools">
            <button id="reset" data-i18n="reset" type="button" class="secondary">Reset camera</button>
            <button id="zoom-in" data-i18n="zoomIn" type="button" class="secondary">Zoom in</button>
            <button id="zoom-out" data-i18n="zoomOut" type="button" class="secondary">Zoom out</button>
          </div>
          <div class="layers" data-i18n-aria="layers" aria-label="Skin layers">
            <label><input id="inner" type="checkbox" checked /> <span data-i18n="inner">Inner</span></label>
            <label><input id="outer" type="checkbox" checked /> <span data-i18n="outer">Outer</span></label>
          </div>
        </div>
        <p class="control-label" id="animation-label" data-i18n="animation">Animation</p>
        <div class="animations" role="group" aria-labelledby="animation-label">
          <button type="button" data-animation="idle" data-i18n="idle" aria-pressed="true" class="secondary">Idle</button>
          <button type="button" data-animation="walk" data-i18n="walk" aria-pressed="false" class="secondary">Walk</button>
          <button type="button" data-animation="run" data-i18n="run" aria-pressed="false" class="secondary">Run</button>
          <button id="pause" type="button" data-i18n="pause" aria-pressed="false" class="secondary">Pause</button>
        </div>
        <div id="model-controls" hidden>
          <label for="preview-model" data-i18n="previewModel">Preview model</label>
          <select id="preview-model">
            <option value="auto" data-i18n="automatic">Automatic</option>
            <option value="classic" data-i18n="classic">Classic</option>
            <option value="slim" data-i18n="slim">Slim</option>
          </select>
          <p class="hint" data-i18n="previewModelOnly">Changes the 3D preview only.</p>
        </div>
      </fieldset>
      <fieldset id="sharing" disabled>
        <div class="sharing">
          <button id="share-skin" data-i18n="shareSkin" type="button">Share Skin</button>
          <button id="share-view" data-i18n="shareView" type="button" class="secondary">Share Three-view</button>
        </div>
      </fieldset>
      <p id="share-status" class="hint" role="status"></p>
      <textarea id="inline-query" data-i18n-aria="inlineQuery" aria-label="Inline query" rows="4" readonly hidden></textarea>
      <button id="copy-query" data-i18n="copyQuery" type="button" class="secondary" hidden>Copy inline query</button>
      <a id="share-fallback" data-i18n="openTelegram" class="share-fallback" hidden>Open Telegram</a>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
