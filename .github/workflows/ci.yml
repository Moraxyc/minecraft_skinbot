name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    viewer:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: web
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '24.22.1'
                  cache: npm
                  cache-dependency-path: web/package-lock.json
            - name: Install pinned npm
              run: |
                  npm_package="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const manifest = JSON.parse(readFileSync("package.json", "utf8")); if (!/^npm@\d+\.\d+\.\d+$/.test(manifest.packageManager)) throw new Error("packageManager must pin npm"); console.log(manifest.packageManager);')"
                  npm install --global "$npm_package" --ignore-scripts
            - run: npm ci --ignore-scripts
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            - run: test -s dist/index.html
